spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-6ly5qzzk8iae1ohp.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=http://localhost:8080

stripe.key.secret=${STRIPE_SECRET_KEY}
